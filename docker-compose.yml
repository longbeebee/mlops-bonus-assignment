services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mlops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mlops}
      POSTGRES_DB: ${POSTGRES_DB:-mlflow}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/postgres-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mlops} -d ${POSTGRES_DB:-mlflow}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [mlops]

  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio_data:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [mlops]

  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      minio: {condition: service_healthy}
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-mlflow}
    entrypoint: ["/bin/sh", "-c"]
    command: >-
      "mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb --ignore-existing local/$$MINIO_BUCKET"
    networks: [mlops]

  mlflow:
    build: ./mlflow
    environment:
      MLFLOW_S3_ENDPOINT_URL: ${MLFLOW_S3_ENDPOINT_URL:-http://minio:9000}
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
    command: >-
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri postgresql+psycopg2://${POSTGRES_USER:-mlops}:${POSTGRES_PASSWORD:-mlops}@postgres:5432/${MLFLOW_DB:-mlflow}
      --default-artifact-root s3://${MINIO_BUCKET:-mlflow}/
    ports: ["5000:5000"]
    depends_on:
      postgres: {condition: service_healthy}
      minio-init: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [mlops]

  airflow-init:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    environment: &airflow-env
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-mlops}:${POSTGRES_PASSWORD:-mlops}@postgres:5432/${AIRFLOW_DB:-airflow}
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth
      AIRFLOW__WEBSERVER__SECRET_KEY: change-me-in-development
      MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI:-http://mlflow:5000}
      MLFLOW_S3_ENDPOINT_URL: ${MLFLOW_S3_ENDPOINT_URL:-http://minio:9000}
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MLFLOW_MODEL_NAME: ${MLFLOW_MODEL_NAME:-sklearn-iris-classifier}
      MLFLOW_MODEL_ALIAS: ${MLFLOW_MODEL_ALIAS:-champion}
    user: "${AIRFLOW_UID:-50000}:0"
    command: bash -c "airflow db migrate && airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@example.com || true"
    depends_on:
      postgres: {condition: service_healthy}
    networks: [mlops]

  airflow-webserver:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    environment: *airflow-env
    user: "${AIRFLOW_UID:-50000}:0"
    command: webserver
    ports: ["8080:8080"]
    depends_on:
      airflow-init: {condition: service_completed_successfully}
      mlflow: {condition: service_healthy}
    networks: [mlops]

  airflow-scheduler:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    environment: *airflow-env
    user: "${AIRFLOW_UID:-50000}:0"
    command: scheduler
    depends_on:
      airflow-init: {condition: service_completed_successfully}
      mlflow: {condition: service_healthy}
    networks: [mlops]

  api:
    build: ./api
    environment:
      MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI:-http://mlflow:5000}
      MLFLOW_S3_ENDPOINT_URL: ${MLFLOW_S3_ENDPOINT_URL:-http://minio:9000}
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MLFLOW_MODEL_NAME: ${MLFLOW_MODEL_NAME:-sklearn-iris-classifier}
      MLFLOW_MODEL_ALIAS: ${MLFLOW_MODEL_ALIAS:-champion}
    ports: ["8000:8000"]
    depends_on:
      mlflow: {condition: service_healthy}
    networks: [mlops]

volumes:
  postgres_data:
  minio_data:

networks:
  mlops:
    name: mlops-network
    driver: bridge
